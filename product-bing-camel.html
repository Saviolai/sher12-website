<!DOCTYPE html><html><head>
<!-- Self-hosted Syncopate (CN-safe) -->
<style>
@font-face{font-family:'Syncopate';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/syncopate-400.woff2') format('woff2');}
@font-face{font-family:'Syncopate';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/syncopate-700.woff2') format('woff2');}
</style>
<meta charset="UTF-8"><meta http-equiv="refresh" content="0;url=index.html#products"><title>Redirecting...</title></head><body><script>
/* 背景图懒加载 */
(function(){
  var els = document.querySelectorAll('[data-bg]');
  if (!els.length) return;
  function apply(el){
    el.style.backgroundImage = "url('" + el.getAttribute('data-bg') + "')";
    el.removeAttribute('data-bg');
  }
  if (!('IntersectionObserver' in window)) { els.forEach(apply); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { apply(e.target); io.unobserve(e.target); }
    });
  }, {rootMargin: '300px'});
  els.forEach(function(el){ io.observe(el); });
})();
</script>
<script src="i18n-dict.js"></script><script src="i18n.js"></script></body></html>
